
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Node.js application
        run: node --check server.js

      - name: Deploy to Dokku
        run: |
          git remote add dokku dokku@127.0.0.1:devops-app
          GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -i /home/ahmed/.ssh/id_rsa" git push dokku HEAD:master
