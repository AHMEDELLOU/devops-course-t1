
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test CI/CD
        run: |
          echo "CI/CD Pipeline is working!"
          echo "Running on Ubuntu!"
          whoami
          timeout 15s dokku version
